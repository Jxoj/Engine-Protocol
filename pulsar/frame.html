<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="/scram/scramjet.all.js"></script><script src="/baremux/index.js"></script><script src="/register-sw.js"></script><style>html,body,iframe{width:100%;height:100%;margin:0;border:0;overflow:hidden}body{background:#fff}</style></head><body><script>(async()=>{const target=new URLSearchParams(location.search).get('url');if(!target)throw Error('Missing proxied URL');await registerSW();const connection=new BareMux.BareMuxConnection('/baremux/worker.js');const websocket=`${location.protocol==='https:'?'wss':'ws'}://${location.host}/wisp/`;if((await connection.getTransport())!=='/libcurl/index.mjs')await connection.setTransport('/libcurl/index.mjs',[{websocket}]);const controller=new ScramjetController({files:{wasm:'/scram/scramjet.wasm.wasm',all:'/scram/scramjet.all.js',sync:'/scram/scramjet.sync.js'}});await controller.init();const frame=controller.createFrame();frame.frame.style.cssText='width:100%;height:100%;border:0';document.body.appendChild(frame.frame);frame.go(target)})();</script></body></html>
